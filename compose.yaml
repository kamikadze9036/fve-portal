services:
  fve-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: fve-portal:local
    ports:
      - "${FVE_PORT:-8787}:8787"
    environment:
      PORT: 8787
      DATABASE_PATH: /data/fve.db
    volumes:
      - fve-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/data').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  fve-data:
    name: fve-portal-data
